<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- spotlight beam falling on the stage -->
  <path d="M27 14 L37 14 L50 46 L14 46 Z" fill="url(#beam)"/>
  <!-- fixture -->
  <rect x="25" y="9" width="14" height="7" rx="2.5" fill="#fde68a"/>
  <!-- stage / track line with three tracked items -->
  <rect x="9" y="47" width="46" height="4" rx="2" fill="#a5b4fc"/>
  <circle cx="20" cy="49" r="3.2" fill="#1e1b4b" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="32" cy="49" r="3.2" fill="#1e1b4b" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="44" cy="49" r="3.2" fill="#1e1b4b" stroke="#fbbf24" stroke-width="2"/>
</svg>
